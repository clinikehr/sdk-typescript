name: Publish to npm

# Runs when a version tag (for example v0.1.0) is pushed. Publishing uses npm
# trusted publishing (GitHub OIDC), so no long-lived npm token is needed:
# link this repository and the workflow file name publish.yml as the trusted
# publisher of @clinikehr/api on npmjs.com.
#
# The very first release of a package cannot use trusted publishing (the
# package must exist before a trusted publisher can be linked). For that one
# release only, an NPM_TOKEN repository secret is used when present. Delete
# the secret once the trusted publisher is linked; later releases then use
# OIDC alone.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Tag must equal the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Publish with trusted publishing (OIDC)
        if: env.NPM_TOKEN == ''
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

      - name: Publish with NPM_TOKEN (first release only)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
