name: Publish to npm

# Runs when a version tag (for example v0.1.0) is pushed. Publishing uses npm
# trusted publishing (GitHub OIDC), so no long-lived npm token is needed:
# link this repository and the workflow file name publish.yml as the trusted
# publisher of @clinikehr/api on npmjs.com.
#
# The trusted publisher was linked on 2026-10-09 (0.1.0-0.1.2 went out with a
# one-off token, since a package must exist before a publisher can be linked).
# There is deliberately no token path any more: a publish that cannot prove it
# came from this workflow fails instead of falling back to a secret.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Load the BUILT CommonJS and ESM entry points and make one call each: 0.1.0-0.1.2 passed
      # every source test while require("@clinikehr/api") could not create a client.
      - run: npm run smoke:dist

      - name: Tag must equal the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Publish with trusted publishing (OIDC)
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
